          add: "{{ competition_accounts | selectattr('admin') | map(attribute='sam') | list }}"
        state: present
 
# PLAY 11: Fully disable Windows Defender on every host so it can't auto-clean
- name: Disable Windows Defender on all hosts
  hosts: windows
  gather_facts: no
 
  tasks:
  
    - name: Disable Defender via policy registry key
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender
        name: DisableAntiSpyware
        data: 1
        type: dword
        state: present
 
    - name: Disable Defender real-time protection
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection
        name: "{{ item }}"
        data: 1
        type: dword
        state: present
      loop:
        - DisableRealtimeMonitoring
        - DisableBehaviorMonitoring
        - DisableOnAccessProtection
        - DisableScanOnRealtimeEnable

    - name: Disable SmartScreen for apps and files (system-wide policy)
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\System
        name: EnableSmartScreen
        data: 0
        type: dword
        state: present

    - name: Disable SmartScreen in Microsoft Edge
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Edge
        name: SmartScreenEnabled
        data: 0
        type: dword
        state: present
 
    - name: Ensure C drive is excluded from Windows Defender scanning
      ansible.windows.win_powershell:
        script: |
          $Ansible.Changed = $false

          # Check whether Windows Defender PowerShell cmdlets exist
          if (-not (Get-Command Get-MpPreference -ErrorAction SilentlyContinue)) {
              Write-Output "Windows Defender cmdlets are not installed on this host. Nothing to configure."
              return
          }

          # Get current Defender exclusions
          $CurrentExclusions = (Get-MpPreference).ExclusionPath

          # Check whether C:\ is already excluded
          if ($CurrentExclusions -contains 'C:\') {
              Write-Output "C:\ is already excluded from Windows Defender scanning."
              return
          }

          # Add C:\ without overwriting any existing exclusions
          Add-MpPreference -ExclusionPath 'C:\'

          $Ansible.Changed = $true
          Write-Output "Added C:\ to Windows Defender exclusions."

    - name: Uninstall the Windows Defender feature entirely
      ansible.windows.win_feature:
        name: Windows-Defender
        state: absent
      register: defender_feature
 
    - name: Reboot if removing the Defender feature requires it
      ansible.windows.win_reboot:
        msg: "Rebooting after removing Windows Defender"
        pre_reboot_delay: 15
      when: defender_feature.reboot_required

# PLAY 12: Set each host's wallpaper for local and domain user sign-ins
- name: Configure planet wallpapers on all Windows hosts
  hosts: windows
  gather_facts: false
  tags:
    - wallpapers

  vars:
    wallpaper_dir: 'C:\Program Files\Galactic_Republic\Wallpaper'
    wallpaper_files:
      windows-host-1: coruscant.png
      windows-host-2: naboo.jpg
      windows-host-3: kamino.jpg
      windows-host-4: felucia.png
      windows-host-5: alderaan.jpg

  tasks:
    - name: Verify this host has a wallpaper mapping
      ansible.builtin.assert:
        that: inventory_hostname in wallpaper_files
        fail_msg: 'Add this host to wallpaper_files before running this play.'

    - name: Create wallpaper directory
      ansible.windows.win_file:
        path: '{{ wallpaper_dir }}'
        state: directory

    - name: Copy the matching planet image
      ansible.windows.win_copy:
        src: '{{ playbook_dir }}/wallpapers/{{ wallpaper_files[inventory_hostname] }}'
        dest: '{{ wallpaper_dir }}\{{ wallpaper_files[inventory_hostname] }}'
      register: wallpaper_copy

    - name: Check for the Windows bitmap
      ansible.windows.win_stat:
        path: '{{ wallpaper_dir }}\wallpaper.bmp'
      register: wallpaper_bitmap

    - name: Convert the planet image to a Windows bitmap
      ansible.windows.win_powershell:
        error_action: stop
        parameters:
          Source: '{{ wallpaper_dir }}\{{ wallpaper_files[inventory_hostname] }}'
          Destination: '{{ wallpaper_dir }}\wallpaper.bmp'
        script: |
          param([string]$Source, [string]$Destination)
          Add-Type -AssemblyName System.Drawing
          $image = [System.Drawing.Image]::FromFile($Source)
          try {
              $image.Save($Destination, [System.Drawing.Imaging.ImageFormat]::Bmp)
          }
          finally {
              $image.Dispose()
          }
      when: wallpaper_copy.changed or not wallpaper_bitmap.stat.exists

    - name: Create the user sign-in wallpaper script
      ansible.windows.win_copy:
        dest: '{{ wallpaper_dir }}\Set-Wallpaper.ps1'
        content: |
          $ErrorActionPreference = 'Stop'
          $wallpaper = Join-Path $PSScriptRoot 'wallpaper.bmp'
          if (-not (Test-Path -LiteralPath $wallpaper)) {
              throw "Wallpaper file is missing: $wallpaper"
          }

          # This script runs as the desktop user, including local Administrator.
          $desktop = 'HKCU:\Control Panel\Desktop'
          New-ItemProperty -Path $desktop -Name WallpaperStyle -Value '10' -PropertyType String -Force | Out-Null
          New-ItemProperty -Path $desktop -Name TileWallpaper -Value '0' -PropertyType String -Force | Out-Null

          Add-Type -TypeDefinition @'
          using System.Runtime.InteropServices;
          public static class RepublicWallpaper {
              [DllImport("user32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
              [return: MarshalAs(UnmanagedType.Bool)]
              public static extern bool SystemParametersInfo(uint action, uint parameter, string value, uint flags);
          }
          '@

          # SPI_SETDESKWALLPAPER; save the setting and broadcast the change.
          if (-not [RepublicWallpaper]::SystemParametersInfo(20, 0, $wallpaper, 3)) {
              throw 'Windows could not apply the desktop wallpaper.'
          }

    - name: Remove the previous wallpaper startup entry
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run
        name: GalacticRepublicWallpaper
        state: absent

    - name: Create wallpaper launcher with error logging
      ansible.windows.win_copy:
        dest: '{{ wallpaper_dir }}\Start-Wallpaper.ps1'
        content: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:TEMP 'GalacticRepublicWallpaper.log'

          try {
              & (Join-Path $PSScriptRoot 'Set-Wallpaper.ps1')
              "$(Get-Date -Format o): Wallpaper applied for $env:USERDOMAIN\$env:USERNAME" |
                  Set-Content -LiteralPath $log
              exit 0
          }
          catch {
              $_ | Out-String | Set-Content -LiteralPath $log
              exit 1
          }

    - name: Configure wallpaper task for interactive users
      community.windows.win_scheduled_task:
        name: Galactic Republic Wallpaper
        path: '\'
        description: Apply this host's planet wallpaper at user sign-in.
        group: 'S-1-5-4'
        logon_type: group
        run_level: limited

        actions:
          - path: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
            arguments: '-NoProfile -NonInteractive -ExecutionPolicy Bypass -WindowStyle Hidden -File "{{ wallpaper_dir }}\Start-Wallpaper.ps1"'
            working_directory: '{{ wallpaper_dir }}'

        triggers:
          - type: logon
            delay: PT15S

        multiple_instances: 2
        execution_time_limit: PT1M
        disallow_start_if_on_batteries: false
        stop_if_going_on_batteries: false
        allow_demand_start: true
        enabled: true
        state: present

    - name: Update the wallpaper image enforced by the existing policy
      become: true
      become_method: runas
      become_user: SYSTEM
      ansible.windows.win_powershell:
        error_action: stop
        parameters:
          Source: '{{ wallpaper_dir }}\{{ wallpaper_files[inventory_hostname] }}'
        script: |
          param([string]$Source)
          $destination = 'C:\Windows\Web\Wallpaper\Cloud\Wallpaper.jpg'
          $backup = 'C:\Windows\Web\Wallpaper\Cloud\Wallpaper.original.jpg'
          $folder = Split-Path -Parent $destination
          New-Item -Path $folder -ItemType Directory -Force | Out-Null

          if ((Test-Path -LiteralPath $destination) -and
              -not (Test-Path -LiteralPath $backup)) {
              Copy-Item -LiteralPath $destination -Destination $backup
          }

          Add-Type -AssemblyName System.Drawing
          $image = [System.Drawing.Image]::FromFile($Source)
          try {
              $image.Save($destination, [System.Drawing.Imaging.ImageFormat]::Jpeg)
          }
          finally {
              $image.Dispose()
          }

          # Clear cached copies so Windows rebuilds them at the next sign-in.
          $profiles = Get-CimInstance Win32_UserProfile |
              Where-Object {
                  $_.SID -like 'S-1-5-21-*' -and
                  -not $_.Special -and
                  (Test-Path -LiteralPath $_.LocalPath)
              }

          foreach ($profile in $profiles) {
              $themes = Join-Path $profile.LocalPath 'AppData\Roaming\Microsoft\Windows\Themes'
              $transcoded = Join-Path $themes 'TranscodedWallpaper'

              if (Test-Path -LiteralPath $transcoded) {
                  Remove-Item -LiteralPath $transcoded -Force
              }

              $cache = Join-Path $themes 'CachedFiles'
              if (Test-Path -LiteralPath $cache) {
                  Get-ChildItem -LiteralPath $cache -Filter 'CachedImage*' -File |
                      Remove-Item -Force
              }
          }

          Write-Output "Updated $destination. Sign out and sign back in to load the planet wallpaper."
    - name: Inspect wallpaper settings and execution logs
      tags:
        - wallpaper_diagnostics
      become: true
      become_method: runas
      become_user: SYSTEM
      ansible.windows.win_powershell:
        error_action: stop
        script: |
          $Ansible.Changed = $false

          $task = Get-ScheduledTaskInfo -TaskName 'Galactic Republic Wallpaper'
          Write-Output "Current time: $((Get-Date).ToString('o'))"
          Write-Output "Last run: $($task.LastRunTime.ToString('o'))"
          Write-Output "Task result: $($task.LastTaskResult)"

          $profiles = Get-CimInstance Win32_UserProfile |
              Where-Object { $_.Loaded -and -not $_.Special }

          foreach ($profile in $profiles) {
              Write-Output "PROFILE: $($profile.LocalPath)"
              $root = "Registry::HKEY_USERS\$($profile.SID)"

              $paths = @(
                  "$root\Control Panel\Desktop"
                  "$root\Software\Microsoft\Windows\CurrentVersion\Policies\System"
                  "$root\Software\Microsoft\Windows\CurrentVersion\Policies\ActiveDesktop"
              )

              foreach ($path in $paths) {
                  $values = Get-ItemProperty -LiteralPath $path -ErrorAction SilentlyContinue
                  Write-Output "KEY: $path"
                  if ($null -ne $values) {
                      $values |
                          Select-Object Wallpaper, WallpaperStyle, NoChangingWallPaper |
                          ConvertTo-Json -Compress |
                          Write-Output
                  }
              }

              $temp = Join-Path $profile.LocalPath 'AppData\Local\Temp'
              $log = Get-ChildItem -LiteralPath $temp `
                  -Filter GalacticRepublicWallpaper.log `
                  -Recurse -File -ErrorAction SilentlyContinue |
                  Sort-Object LastWriteTime -Descending |
                  Select-Object -First 1

              if ($log) {
                  Write-Output "LOG: $($log.FullName)"
                  Write-Output "Modified: $($log.LastWriteTime.ToString('o'))"
                  Get-Content -LiteralPath $log.FullName | Write-Output
              }
              else {
                  Write-Output 'No wallpaper execution log found for this profile.'
              }
          }
      register: wallpaper_diagnostics

    - name: Display wallpaper diagnostics
      tags:
        - wallpaper_diagnostics
      ansible.builtin.debug:
        var: wallpaper_diagnostics.output


# ============================================================================
# Operation Shattered Beacon — scavenger hunt deployment
#
# Assumes, next to this playbook and inventory.ini:
#   scavengerhunt/Operation_Shattered_Beacon/   (everything from the build-pack ZIP)
#
# Coruscant (windows-host-1) does the MSVC build, since it's the one host we
# confirmed has the Visual Studio Build Tools. Adjust msvc_vcvarsall below if
# its VS install path differs. Domain/DNS values match the DC set up earlier
# in this playbook (clone.wars / 10.110.20.11).
#
# Flow:
#   1. Stage the build pack on Coruscant, add the hunt DNS record, compile
#      all 21 checkpoints, archive each planet's binaries.
#   2. On every windows host: stage only that planet's own setup scripts,
#      run its Initialize-<Planet>.ps1, drop its compiled executables into
#      C:\Republic\Hunt, and confirm at least one .exe landed.
#   3. Once every planet has confirmed a successful deploy, wipe the
#      organizer-only staging folder on Coruscant (source, answer keys,
#      build config, everything) so there's no trace left for players to find.
# ============================================================================

# PLAY: Stage and build Operation Shattered Beacon on Coruscant
- name: Stage and build Operation Shattered Beacon on Coruscant
  hosts: windows-host-1
  vars:
    hunt_domain: clone.wars
    hunt_dns_server: "10.110.20.11"
    hunt_pack_src: "{{ playbook_dir }}/scavengerhunt/Operation_Shattered_Beacon"
    hunt_staging_dir: 'C:\Republic\HuntBuild'
    # Only used as a fallback if cl.exe isn't already on PATH. Adjust to match
    # the actual Visual Studio Build Tools install on this host.
    msvc_vcvarsall: 'C:\Program Files (x86)\Microsoft Visual Studio\2019\BuildTools\VC\Auxiliary\Build\vcvarsall.bat'

  tasks:

    - name: Create organizer-only staging directory for the build pack
      ansible.windows.win_file:
        path: '{{ hunt_staging_dir }}'
        state: directory

    - name: Copy the Operation Shattered Beacon build pack to the staging directory
      ansible.windows.win_copy:
        src: "{{ hunt_pack_src }}/"
        dest: '{{ hunt_staging_dir }}\'

    - name: Add the hunt DNS anchor TXT record
      ansible.windows.win_shell: |
        & '{{ hunt_staging_dir }}\setup\Setup-Dns.ps1' -Domain '{{ hunt_domain }}'
      register: hunt_dns_setup
      changed_when: "'already exists' not in hunt_dns_setup.stdout"

    - name: Compile all 21 checkpoints with Build.ps1
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        $buildScript = '{{ hunt_staging_dir }}\Build.ps1'

        if (-not (Test-Path -LiteralPath $buildScript)) {
            throw "Build script missing: $buildScript"
        }

        if (Get-Command cl.exe -ErrorAction SilentlyContinue) {
            & $buildScript -DnsServer '{{ hunt_dns_server }}' -Domain '{{ hunt_domain }}'
        }
        else {
            $vcvars = $null
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

            if (Test-Path -LiteralPath $vswhere) {
                $installPath = & $vswhere -latest -products '*' `
                    -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
                    -property installationPath

                if ($LASTEXITCODE -ne 0) {
                    throw "Visual Studio discovery failed."
                }

                if ($installPath) {
                    $installPath = ($installPath | Select-Object -First 1).Trim()
                    $candidate = Join-Path $installPath 'VC\Auxiliary\Build\vcvarsall.bat'

                    if (Test-Path -LiteralPath $candidate) {
                        $vcvars = $candidate
                    }
                }
            }

            if (-not $vcvars) {
                $fallback = '{{ msvc_vcvarsall }}'
                if (Test-Path -LiteralPath $fallback) {
                    $vcvars = $fallback
                }
            }

            if (-not $vcvars) {
                throw 'No MSVC C++ toolchain found on Coruscant. Install Visual Studio Build Tools with the Desktop development with C++ workload, then rerun.'
            }

            Write-Output "Using compiler environment: $vcvars"

            $launcher = '{{ hunt_staging_dir }}\Run-HuntBuild.cmd'
            $commands = @(
                '@echo off'
                ('call "{0}" x64' -f $vcvars)
                'if errorlevel 1 exit /b %errorlevel%'
                ('powershell.exe -NoProfile -ExecutionPolicy Bypass -File "{0}" -DnsServer "{1}" -Domain "{2}"' -f $buildScript, '{{ hunt_dns_server }}', '{{ hunt_domain }}')
                'exit /b %errorlevel%'
            )

            Set-Content -LiteralPath $launcher -Value $commands -Encoding ASCII

            try {
                & $env:ComSpec /d /c .\Run-HuntBuild.cmd
                if ($LASTEXITCODE -ne 0) {
                    throw "Hunt build failed with exit code $LASTEXITCODE."
                }
            }
            finally {
                Remove-Item -LiteralPath $launcher -Force -ErrorAction SilentlyContinue
            }
        }
      args:
        chdir: '{{ hunt_staging_dir }}'
      register: hunt_build
      
    - name: Show build output
      ansible.builtin.debug:
        var: hunt_build.stdout_lines

    - name: Archive each planet's compiled executables for transfer
      ansible.windows.win_powershell:
        error_action: stop
        script: |
          $binRoot = '{{ hunt_staging_dir }}\bin'
          Get-ChildItem -Path $binRoot -Directory | ForEach-Object {
              $zip = Join-Path '{{ hunt_staging_dir }}' ($_.Name + '.zip')
              if (Test-Path $zip) { Remove-Item $zip -Force }
              Compress-Archive -Path (Join-Path $_.FullName '*') -DestinationPath $zip
          }

    - name: Fetch each planet's compiled-executable archive to the control node
      ansible.builtin.fetch:
        src: '{{ hunt_staging_dir }}\{{ item }}.zip'
        dest: "{{ playbook_dir }}/scavengerhunt_build/{{ item }}.zip"
        flat: true
      loop:
        - Coruscant
        - Naboo
        - Kamino
        - Felucia
        - Alderaan


# PLAY: Prepare evidence fixtures and deploy checkpoint binaries on every planet
- name: Prepare evidence fixtures and deploy checkpoint binaries
  hosts: windows
  vars:
    hunt_domain: clone.wars
    hunt_dns_server: "10.110.20.11"
    hunt_planet_names:
      windows-host-1: Coruscant
      windows-host-2: Naboo
      windows-host-3: Kamino
      windows-host-4: Felucia
      windows-host-5: Alderaan
    hunt_setup_src: "{{ playbook_dir }}/scavengerhunt/Operation_Shattered_Beacon/setup"
    hunt_staging_dir: 'C:\Republic\HuntBuild'
    hunt_deploy_dir: 'C:\Republic\Hunt'

  tasks:

    - name: Verify this host has a scavenger-hunt planet mapping
      ansible.builtin.assert:
        that: inventory_hostname in hunt_planet_names
        fail_msg: 'Add this host to hunt_planet_names before running the scavenger hunt deploy play.'

    - name: Set this host's planet name
      ansible.builtin.set_fact:
        hunt_planet: "{{ hunt_planet_names[inventory_hostname] }}"

    - name: Create organizer-only staging directory
      ansible.windows.win_file:
        path: '{{ hunt_staging_dir }}'
        state: directory

    - name: Copy this planet's Initialize script
      ansible.windows.win_copy:
        src: "{{ hunt_setup_src }}/Initialize-{{ hunt_planet }}.ps1"
        dest: '{{ hunt_staging_dir }}\setup\Initialize-{{ hunt_planet }}.ps1'
      when: hunt_planet != 'Coruscant'

    - name: Copy this planet's checkpoint scripts
      ansible.windows.win_copy:
        src: "{{ hunt_setup_src }}/checkpoints/{{ hunt_planet }}/"
        dest: '{{ hunt_staging_dir }}\setup\checkpoints\{{ hunt_planet }}\'
      when: hunt_planet != 'Coruscant'

    - name: Copy the shared hunt setup helper
      ansible.windows.win_copy:
        src: "{{ hunt_setup_src }}/Common.ps1"
        dest: '{{ hunt_staging_dir }}\setup\Common.ps1'

    - name: Prepare Coruscant evidence fixtures (DNS-gated)
      ansible.windows.win_shell: |
        & '{{ hunt_staging_dir }}\setup\Initialize-Coruscant.ps1' -DnsServer {{ hunt_dns_server }} -Domain '{{ hunt_domain }}'
      when: hunt_planet == 'Coruscant'
      register: hunt_init_result

    - name: Prepare this planet's evidence fixtures
      ansible.windows.win_shell: |
        & '{{ hunt_staging_dir }}\setup\Initialize-{{ hunt_planet }}.ps1'
      when: hunt_planet != 'Coruscant'
      register: hunt_init_result

    - name: Show evidence-preparation output
      ansible.builtin.debug:
        var: hunt_init_result.stdout_lines

    - name: Copy this planet's compiled-executable archive to the host
      ansible.windows.win_copy:
        src: "{{ playbook_dir }}/scavengerhunt_build/{{ hunt_planet }}.zip"
        dest: '{{ hunt_staging_dir }}\{{ hunt_planet }}.zip'

    - name: Create the player-facing hunt directory
      ansible.windows.win_file:
        path: '{{ hunt_deploy_dir }}'
        state: directory

    - name: Extract the compiled checkpoint executables into the player-facing directory
      community.windows.win_unzip:
        src: '{{ hunt_staging_dir }}\{{ hunt_planet }}.zip'
        dest: '{{ hunt_deploy_dir }}'

    - name: Confirm at least one checkpoint executable was deployed
      ansible.windows.win_find:
        paths: '{{ hunt_deploy_dir }}'
        patterns: '*.exe'
        recurse: true
      register: hunt_deploy_check

    - name: Record successful deployment for this planet
      ansible.builtin.set_fact:
        hunt_deploy_ok: "{{ hunt_deploy_check.matched > 0 }}"

    - name: Fail loudly if no executables were deployed
      ansible.builtin.assert:
        that: hunt_deploy_ok
        fail_msg: 'No checkpoint executables were found under {{ hunt_deploy_dir }} on {{ hunt_planet }} - deployment did not complete.'


# PLAY: Once every planet is confirmed, erase the build evidence from Coruscant
- name: Wipe Operation Shattered Beacon build evidence from Coruscant
  hosts: windows-host-1
  vars:
    hunt_staging_dir: 'C:\Republic\HuntBuild'

  tasks:

    - name: Confirm every planet finished deployment before wiping Coruscant evidence
      ansible.builtin.assert:
        that: hostvars[item].hunt_deploy_ok | default(false)
        fail_msg: "{{ item }} has not confirmed a successful hunt deployment yet - refusing to erase build evidence on Coruscant."
      loop: "{{ groups['windows'] }}"

    - name: Remove the build pack, source, organizer keys, and staged setup scripts from Coruscant
      ansible.windows.win_file:
        path: '{{ hunt_staging_dir }}'
        state: absent
